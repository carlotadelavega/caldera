# tox (https://tox.readthedocs.io/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. Dependencies come from
# pyproject.toml / uv.lock via tox-uv. To use it:
#   uv tool install tox --with tox-uv
# and then run "tox" from this directory.

[tox]
requires =
    tox>=4.25
    tox-uv>=1.25
envlist =
    py{310,311,312,313}
    style
    coverage
    safety
    bandit
skip_missing_interpreters = true

[testenv]
description = run tests
# Install exactly what uv.lock pins (fails if the lock is out of date).
runner = uv-venv-lock-runner
dependency_groups = dev
allowlist_externals = mkdir
commands =
    mkdir -p plugins/magma/dist/assets
    coverage run -p -m pytest --tb=short tests -vv

[testenv:style]
commands =
    pre-commit run --all-files --show-diff-on-failure

[testenv:coverage]
commands =
    coverage combine
    coverage html
    coverage report

[testenv:coverage-ci]
commands =
    coverage combine
    coverage xml
    coverage report

[testenv:safety]
# Dependency vulnerability scan. Env name kept as "safety" so branch
# protection contexts (`build (3.13, safety)`) don't need a coordinated
# update; underlying tool is pip-audit (PyPA, no API key, free).
#
# `safety check` was deprecated 2024-06; the pyup.io account/scan
# replacement was not worth the new secret + auth integration when
# Dependabot, GitGuardian, and SonarCloud already cover supply chain.
#
# Legacy pyup ignores (39642 reportlab, 39659 aiohttp) are obsolete
# now that aiohttp>=3.13 and reportlab>=4.0 are pinned. Add
# `--ignore-vuln GHSA-...` here if a real exemption is needed later.
# Audits every package pinned in uv.lock (runtime + dev), exported with hashes.
allowlist_externals = uv
commands =
    uv export --locked --all-groups --no-emit-project -o {env_tmp_dir}/requirements.txt
    pip-audit --disable-pip -r {env_tmp_dir}/requirements.txt

[testenv:bandit]
commands =
    bandit -r app -ll --exclude=tests/ --skip=B303
