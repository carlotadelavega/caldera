# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  # Install dependencies with uv from uv.lock
  # (https://docs.readthedocs.com/platform/stable/build-customization.html#install-dependencies-with-uv)
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv 0.12.22
      - asdf global uv 0.12.22
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --locked --no-dev

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: plugins/fieldmanual/sphinx-docs/conf.py

# Build all formats (incl. pdf, epub)
formats: all

# Include all submodules
submodules:
  include: all
  recursive: true
