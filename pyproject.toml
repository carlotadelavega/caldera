[project]
name = "caldera"
version = "5.3.0"
description = "Automated adversary emulation platform"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "aioftp==0.27.2",
    "aiohttp==3.14.3",
    "aiohttp-apispec==3.0.0b2",
    "aiohttp-jinja2==1.5.1",
    "aiohttp-security==0.4.0",
    "aiohttp-session==2.12.0",
    "argon2-cffi==25.1.0",
    "asyncssh==2.23.1",
    "croniter~=3.0.3",
    "cryptography==50.0.1",
    "dirhash==0.2.1",
    "dnspython==2.6.1",
    "jinja2==3.1.6",
    "ldap3==2.9.1",
    "lxml==6.1.0",
    "markdown==3.8.1",
    "marshmallow==3.26.2",
    "marshmallow-enum==1.5.1",
    "myst-parser==2.0.0",
    "packaging==23.2",
    "pyasn1==0.6.4",
    "pyyaml==6.0.1",
    "reportlab==4.0.4",
    "rich==13.7.0",
    "setuptools==83.0.0",
    "sphinx==7.1.2",
    "sphinx-rtd-theme==1.3.0",
    "svglib==1.5.1",
    "websockets==15.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "coverage>=7.16.2",
    "pip-audit>=2.9.0",
    "pre-commit>=4.6.2",
    "pytest>=8.2,<9",
    "pytest-aiohttp==1.0.3",
    "pytest-asyncio==0.26.0",
]

[tool.uv]
# Caldera is an application, not a library: install only its dependencies.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
